models:
  - name: dim_listings_cleansed
    description: "Cleansed dimension table for Airbnb listings."
    columns:
      - name: listing_id
        description: "Unique identifier for each listing."
        data_tests:
          - unique
          - not_null
      - name: host_name
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: is_superhost
        description: "Indicates if the host is a superhost ('t' for true, 'f' for false)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']
      - name: host_id
        description: "Unique identifier for each host."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: room_type
        description: "Type of room offered in the listing."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                         'Private room',
                         'Shared room',
                         'Hotel room']
      - name: review_id
        description: "Unique identifier for each review associated with the listing."
        data_tests:
          - dbt_expectations.expect_column_to_exist
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
  - name: dim_hosts_cleansed
    description: "Cleansed table which contains Airbnb hosts."
    columns:
      - name: host_id
        description: "Primary key for the host"
      - name: host_name
        description: '{{ doc("dim_hosts_cleansed__host_name") }}'
      - name: is_superhost
        description: "Whether the host is a superhost"